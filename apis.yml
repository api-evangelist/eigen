name: Eigen
description: >-
  Eigen Technologies is a London-based intelligent document processing (IDP) and
  data-extraction company that uses natural language processing, object detection
  and machine learning to extract, classify and interpret structured data from
  unstructured documents at scale. Its no-code platform lets teams in financial
  services, insurance, law and professional services pull hundreds of datapoints
  out of contracts, loan agreements and filings to manage risk, automate processes
  and meet regulatory obligations, with extracted data pushed downstream via its
  document-processing API. Founded in 2014 and backed by Goldman Sachs, Temasek,
  Lakestar, Dawn Capital, ING Ventures, Anthemis and the Sony Innovation Fund,
  Eigen was acquired by contract-lifecycle-management platform Sirion in June 2024.
